spring.application.name=api
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.github.client-id=${GITHUB_CLIENT_ID:}
app.github.client-secret=${GITHUB_CLIENT_SECRET:}
app.github.callback-url=${GITHUB_CALLBACK_URL:http://localhost:8080/auth/github/callback}
app.ingest-schema=${INGEST_SCHEMA:public}
app.operator.otp-key=${OPERATOR_OTP_KEY:}
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=CF-Connecting-IP
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# capstone 스키마 마이그레이션 (src/main/resources/db/migration)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.schemas=${CAPSTONE_SCHEMA:capstone}
spring.flyway.default-schema=${CAPSTONE_SCHEMA:capstone}
spring.flyway.create-schemas=true
