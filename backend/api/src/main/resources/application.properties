spring.application.name=api
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reposcope}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# capstone 스키마 마이그레이션 (src/main/resources/db/migration)
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.schemas=${CAPSTONE_SCHEMA:capstone}
spring.flyway.default-schema=${CAPSTONE_SCHEMA:capstone}
spring.flyway.create-schemas=true
