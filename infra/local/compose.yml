# 로컬 실행 환경.
#
#   기본 구성: postgres, api
#   수집 구성: 기본 구성 + moto(S3, SQS, SSM) + moto-init + ingest + worker   (--profile ingest)
#
# 저장소 루트에서 실행한다. 사용법은 infra/local/README.md.
#   docker compose --env-file .env -f infra/local/compose.yml up -d
#   docker compose --env-file .env -f infra/local/compose.yml --profile ingest up -d

name: reposcope-local

# api와 worker가 postgres에 접속하는 설정. DB 이름, 사용자, 비밀번호는 .env 값을 쓴다.
x-db: &db
  # 컨테이너 사이의 주소라서 .env의 DB_HOST, DB_PORT를 쓰지 않는다. DB_PORT는 내 컴퓨터에 여는 포트만 바꾼다.
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:?.env에 DB_NAME을 설정한다}
  DB_USER: ${DB_USER:?.env에 DB_USER를 설정한다}
  DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
  DB_SSLMODE: disable

# moto에 접속하는 컨테이너가 쓰는 값. moto는 자격 증명을 검사하지 않으므로 실제 AWS 키가 아니다.
x-aws-local: &aws-local
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME을 설정한다}
      POSTGRES_USER: ${DB_USER:?.env에 DB_USER를 설정한다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ../../backend/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *db
      CAPSTONE_SCHEMA: ${CAPSTONE_SCHEMA:-capstone}
      APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "127.0.0.1:8080:8080"

  # S3, SQS, SSM을 흉내 내는 AWS 에뮬레이터. 메모리에만 저장하므로 재시작하면 비워진다.
  moto:
    profiles: ["ingest"]
    image: motoserver/moto:5.2.5
    ports:
      - "127.0.0.1:4566:5000"

  # moto가 뜬 뒤 S3 버킷, SQS 큐(DLQ 포함), SSM 파라미터를 만든다. 여러 번 실행해도 안전하다.
  # 자원 이름은 .env의 LOCAL_NAME_PREFIX로 만들고, ingest와 worker도 같은 값을 쓴다.
  # compose는 프로필과 관계없이 모든 변수를 채우므로 값 확인은 init-aws.sh가 한다. 값이 없으면 moto-init이 멈추고 ingest, worker도 시작하지 않는다.
  moto-init:
    profiles: ["ingest"]
    image: amazon/aws-cli:2.39.6
    depends_on:
      - moto
    environment:
      <<: *aws-local
      LOCAL_NAME_PREFIX: ${LOCAL_NAME_PREFIX:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      LOCAL_WEBHOOK_SECRET: ${LOCAL_WEBHOOK_SECRET:-}
    entrypoint: ["/bin/sh", "/init/init-aws.sh"]
    volumes:
      - ./init-aws.sh:/init/init-aws.sh:ro

  # API Gateway와 수신 Lambda 대역. POST /webhook 요청을 운영과 같은 핸들러(webhook/src/handler.py)로 처리한다.
  ingest:
    profiles: ["ingest"]
    build:
      context: ../../webhook
      dockerfile: local/Dockerfile
    depends_on:
      moto-init:
        condition: service_completed_successfully
    environment:
      <<: *aws-local
      WEBHOOK_SECRET_PARAM: /${LOCAL_NAME_PREFIX:-}/webhook-secret
      RAW_BUCKET: ${LOCAL_NAME_PREFIX:-}-raw-events
      QUEUE_URL: http://moto:5000/123456789012/${LOCAL_NAME_PREFIX:-}-events
    ports:
      - "127.0.0.1:9000:8080"

  # SQS 메시지를 읽어 S3 원본을 가져오고 수집 테이블에 저장한다. 시작할 때 backend/migrations를 적용한다.
  # .env의 GITHUB_APP_PRIVATE_KEY_FILE에 PEM 파일 경로를 쓰면 읽기 전용으로 넣는다.
  # 비워 두면 빈 파일(/dev/null)이 들어가 GitHub 연동만 꺼지고 정상 동작한다.
  worker:
    profiles: ["ingest"]
    build:
      context: ../..
      dockerfile: backend/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      moto-init:
        condition: service_completed_successfully
    environment:
      <<: [*aws-local, *db]
      INGEST_SCHEMA: ${INGEST_SCHEMA:-public}
      CAPSTONE_SCHEMA: ${CAPSTONE_SCHEMA:-capstone}
      QUEUE_URL: http://moto:5000/123456789012/${LOCAL_NAME_PREFIX:-}-events
      RAW_BUCKET: ${LOCAL_NAME_PREFIX:-}-raw-events
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-key
      APP_VERSION: ${APP_VERSION:-local}
    volumes:
      - type: bind
        source: ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}
        target: /run/secrets/github-app-key
        read_only: true
    restart: unless-stopped

volumes:
  pgdata:
