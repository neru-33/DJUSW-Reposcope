# 로컬 실행 환경.
#
#   기본 구성: postgres, api
#   수집 구성: 기본 구성 + moto(S3, SQS, SSM) + moto-init + ingest + worker   (--profile ingest)
#
# 저장소 루트에서 실행한다. 사용법은 infra/local/README.md.
#   docker compose --env-file .env -f infra/local/compose.yml up -d
#   docker compose --env-file .env -f infra/local/compose.yml --profile ingest up -d

name: reposcope-local

# moto에 접속하는 컨테이너가 쓰는 값. moto는 자격 증명을 검사하지 않으므로 실제 AWS 키가 아니다.
x-aws-local: &aws-local
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-reposcope}
      POSTGRES_USER: ${DB_USER:-reposcope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ../../backend/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-reposcope}
      DB_USER: ${DB_USER:-reposcope}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
      DB_SSLMODE: disable
      CAPSTONE_SCHEMA: ${CAPSTONE_SCHEMA:-capstone}
      APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "127.0.0.1:8080:8080"

  # S3, SQS, SSM을 흉내 내는 AWS 에뮬레이터. 메모리에만 저장하므로 재시작하면 비워진다.
  moto:
    profiles: ["ingest"]
    image: motoserver/moto:5.2.5
    ports:
      - "127.0.0.1:4566:5000"

  # moto가 뜬 뒤 S3 버킷, SQS 큐(DLQ 포함), SSM 파라미터를 만든다. 여러 번 실행해도 안전하다.
  moto-init:
    profiles: ["ingest"]
    image: amazon/aws-cli:2.39.6
    depends_on:
      - moto
    environment:
      <<: *aws-local
      DB_PASSWORD: ${DB_PASSWORD:-}
      LOCAL_WEBHOOK_SECRET: ${LOCAL_WEBHOOK_SECRET:-}
    entrypoint: ["/bin/sh", "/init/init-aws.sh"]
    volumes:
      - ./init-aws.sh:/init/init-aws.sh:ro

  # API Gateway와 수신 Lambda 대역. POST /webhook 요청을 운영과 같은 핸들러(webhook/src/handler.py)로 처리한다.
  ingest:
    profiles: ["ingest"]
    build:
      context: ../../webhook
      dockerfile: local/Dockerfile
    depends_on:
      moto-init:
        condition: service_completed_successfully
    environment:
      <<: *aws-local
      WEBHOOK_SECRET_PARAM: /reposcope/webhook-secret
      RAW_BUCKET: reposcope-raw-events
      QUEUE_URL: http://moto:5000/123456789012/reposcope-events
    ports:
      - "127.0.0.1:9000:8080"

  # SQS 메시지를 읽어 S3 원본을 가져오고 수집 테이블에 저장한다. 시작할 때 backend/migrations를 적용한다.
  # App 키 파일을 마운트하지 않으면 GitHub 연동만 꺼지고 정상 동작한다.
  worker:
    profiles: ["ingest"]
    build:
      context: ../..
      dockerfile: backend/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      moto-init:
        condition: service_completed_successfully
    environment:
      <<: *aws-local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-reposcope}
      DB_USER: ${DB_USER:-reposcope}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
      DB_SSLMODE: disable
      INGEST_SCHEMA: ${INGEST_SCHEMA:-public}
      CAPSTONE_SCHEMA: ${CAPSTONE_SCHEMA:-capstone}
      QUEUE_URL: http://moto:5000/123456789012/reposcope-events
      RAW_BUCKET: reposcope-raw-events
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github-app-key
      APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped

volumes:
  pgdata:
