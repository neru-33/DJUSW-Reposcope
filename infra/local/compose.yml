# 로컬 실행 환경.
#
#   기본 구성: postgres, api
#   수집 구성: 기본 구성 + moto(S3, SQS, SSM) + moto-init   (--profile ingest)
#
# 저장소 루트에서 실행한다. 사용법은 infra/local/README.md.
#   docker compose --env-file .env -f infra/local/compose.yml up -d
#   docker compose --env-file .env -f infra/local/compose.yml --profile ingest up -d

name: reposcope-local

# moto에 접속하는 컨테이너가 쓰는 값. moto는 자격 증명을 검사하지 않으므로 실제 AWS 키가 아니다.
x-aws-local: &aws-local
  AWS_ENDPOINT_URL: http://moto:5000
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: ap-northeast-2
  AWS_DEFAULT_REGION: ap-northeast-2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-reposcope}
      POSTGRES_USER: ${DB_USER:-reposcope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    build:
      context: ../../backend/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-reposcope}
      DB_USER: ${DB_USER:-reposcope}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정한다}
      DB_SSLMODE: disable
      APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "127.0.0.1:8080:8080"

  # S3, SQS, SSM을 흉내 내는 AWS 에뮬레이터. 메모리에만 저장하므로 재시작하면 비워진다.
  moto:
    profiles: ["ingest"]
    image: motoserver/moto:latest
    ports:
      - "127.0.0.1:4566:5000"

  # moto가 뜬 뒤 S3 버킷, SQS 큐(DLQ 포함), SSM 파라미터를 만든다. 여러 번 실행해도 안전하다.
  moto-init:
    profiles: ["ingest"]
    image: amazon/aws-cli:latest
    depends_on:
      - moto
    environment:
      <<: *aws-local
      DB_PASSWORD: ${DB_PASSWORD:-}
      LOCAL_WEBHOOK_SECRET: ${LOCAL_WEBHOOK_SECRET:-}
    entrypoint: ["/bin/sh", "/init/init-aws.sh"]
    volumes:
      - ./init-aws.sh:/init/init-aws.sh:ro

volumes:
  pgdata:
