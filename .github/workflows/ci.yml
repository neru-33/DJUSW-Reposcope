# PR을 올리거나 main에 병합될 때 백엔드와 프런트엔드의 빌드와 테스트를 실행한다.
# AWS 자격 증명과 비밀값은 쓰지 않는다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에서 새로 push하면 이전 실행을 취소한다. main 실행은 실행마다 그룹이 달라 취소되지 않는다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (빌드·테스트)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # MIT 라이선스의 기본 캐시만 사용한다
      # build는 컴파일, 테스트, 실행 파일(jar) 생성까지 한다. DB가 필요한 시험은 환경 변수가 없으면 건너뛴다.
      - run: ./gradlew build --no-daemon

  frontend:
    name: frontend (검사·테스트·빌드)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
