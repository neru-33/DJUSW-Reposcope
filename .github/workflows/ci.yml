# PR을 올리거나 main에 병합될 때 백엔드, 수신 Lambda, worker, 프런트엔드의 빌드와 테스트를 실행한다.
# AWS 자격 증명과 비밀값은 쓰지 않는다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에서 새로 push하면 이전 실행을 취소한다. main 실행은 실행마다 그룹이 달라 취소되지 않는다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (빌드·테스트)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # MIT 라이선스의 기본 캐시만 사용한다
      # build는 컴파일, 테스트, 실행 파일(jar) 생성까지 한다. DB가 필요한 테스트는 러너의 Docker로 PostgreSQL 컨테이너를 띄운다.
      - run: ./gradlew build --no-daemon

  webhook:
    name: webhook (테스트)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 수신 Lambda 단위 테스트. AWS 클라이언트는 테스트용 가짜 객체를 쓰므로 추가 패키지가 필요 없다.
      - run: python -m unittest discover -s webhook/tests -v

  # 수집 worker 테스트. README와 같은 이미지와 명령으로 실행하고, DB 테스트가 건너뛰어지면 실패한다.
  worker:
    name: worker (테스트)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: python:3.13-slim
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: worker_test
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker_test # CI 안에서만 쓰는 시험용 값. 비밀값이 아니다
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 3s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      WORKER_TEST_DB_DSN: postgresql://worker_test:worker_test@postgres:5432/worker_test
    steps:
      - uses: actions/checkout@v7
      - run: pip install -q --root-user-action=ignore -r backend/worker/requirements.txt pytest==9.2.0
      - run: python -m pytest -v -p no:cacheprovider -rs --junitxml=worker-tests.xml backend/worker/tests
      # DSN 이름이 틀리면 DB 테스트가 조용히 건너뛰어지므로, 건너뛴 테스트가 있으면 실패시킨다.
      - name: 건너뛴 테스트 확인
        run: >-
          python -c "import sys, xml.etree.ElementTree as ET;
          n = sum(int(s.get('skipped', 0)) for s in ET.parse('worker-tests.xml').getroot().iter('testsuite'));
          print('skipped:', n); sys.exit(1 if n else 0)"

  frontend:
    name: frontend (검사·테스트·빌드)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
