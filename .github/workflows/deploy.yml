# main에 병합되면 이미지를 ECR에 올리고, EC2의 배포 스크립트를 SSM으로 실행하고, 화면을 웹 버킷에 올린다.
# AWS 자격 증명은 OIDC로 받는 임시 자격 증명만 쓴다(오래 쓰는 접근 키는 저장소에 두지 않는다).
# 설정 방법과 되돌리는 방법은 infra/README.md의 "자동 배포".
#
# 필요한 설정(저장소 Settings → Secrets and variables → Actions)
#   secret   AWS_DEPLOY_ROLE_ARN          terraform output deploy_role_arn
#   variable INSTANCE_ID                  terraform output app_instance_id
#   variable DB_HOST                      terraform output db_address
#   variable WEB_BUCKET                   terraform output web_bucket_name
#   variable CLOUDFRONT_DISTRIBUTION_ID   terraform output web_distribution_id
#   variable GH_APP_ID                    GitHub App ID(비우면 worker의 GitHub 연동이 꺼진다)
name: deploy

on:
  push:
    branches: [main]
    paths:
      - backend/api/**
      - backend/worker/**
      - backend/migrations/**
      - frontend/**
      - infra/deploy/**
      - .github/workflows/deploy.yml
  # 이전 이미지 태그로 되돌릴 때 쓴다. image_tag를 주면 이미지와 화면은 새로 만들지 않고 그 태그로 EC2만 다시 배포한다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "이미 ECR에 있는 이미지 태그(비우면 이 커밋으로 새로 만든다)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

# 배포는 한 번에 하나만 한다. 진행 중인 배포를 취소하지 않고 기다린다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  NAME_PREFIX: reposcope
  API_URL: https://api.eclipse-sync.com

jobs:
  images:
    name: 이미지 빌드와 ECR push
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # 역할은 이 저장소의 main 브랜치 워크플로만 맡을 수 있다. 계정 ID는 로그에서 가려진다.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ECR 로그인
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "${registry}"
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"
      # 태그는 덮어쓸 수 없으므로(IMMUTABLE) 이미 있으면 다시 만들지 않는다. 같은 커밋을 다시 실행해도 안전하다.
      - name: 이미지 만들고 올리기
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          for service in api worker; do
            repo="${NAME_PREFIX}-${service}"
            if out="$(aws ecr describe-images --repository-name "${repo}" --image-ids "imageTag=${TAG}" 2>&1)"; then
              echo "${repo}:${TAG}는 이미 있어 건너뛴다"
              continue
            fi
            case "${out}" in
              *ImageNotFoundException*) ;;
              *) echo "${out}" >&2; exit 1 ;;
            esac
            image="${REGISTRY}/${repo}:${TAG}"
            if [ "${service}" = "api" ]; then
              docker build -t "${image}" backend/api
            else
              docker build -f backend/worker/Dockerfile -t "${image}" .
            fi
            docker push "${image}"
          done

  deploy:
    name: EC2 배포(SSM)
    needs: images
    # 되돌리기(image_tag 지정)에서는 images가 건너뛰어진다. 실패했을 때만 막는다.
    if: ${{ !cancelled() && needs.images.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      DB_HOST: ${{ vars.DB_HOST }}
      GH_APP_ID: ${{ vars.GH_APP_ID }}
      INPUT_TAG: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 입력값 확인
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-sha-${GITHUB_SHA::12}}"
          [[ "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "이미지 태그 형식이 올바르지 않다" >&2; exit 1; }
          [ "${tag}" != "latest" ] || { echo "latest 태그는 쓰지 않는다" >&2; exit 1; }
          [[ "${INSTANCE_ID}" =~ ^i-[0-9a-f]+$ ]] || { echo "variable INSTANCE_ID가 없거나 올바르지 않다" >&2; exit 1; }
          [[ "${DB_HOST}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "variable DB_HOST가 없거나 올바르지 않다" >&2; exit 1; }
          [[ "${GH_APP_ID}" =~ ^[0-9]*$ ]] || { echo "variable GH_APP_ID는 숫자여야 한다" >&2; exit 1; }
          echo "TAG=${tag}" >> "$GITHUB_ENV"
      # compose.yml과 deploy.sh를 명령에 담아 보내므로 EC2는 항상 이 커밋의 파일로 배포한다.
      - name: 배포 명령 보내기
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${account}"
          COMPOSE_B64="$(base64 -w0 infra/deploy/compose.yml)" DEPLOY_B64="$(base64 -w0 infra/deploy/deploy.sh)"           python3 - <<'PY' > command.json
          import json, os, shlex

          prefix = os.environ["NAME_PREFIX"]
          root = f"/opt/{prefix}"
          env = " ".join(
              f"{key}={shlex.quote(value)}"
              for key, value in (
                  ("NAME_PREFIX", prefix),
                  ("DB_HOST", os.environ["DB_HOST"]),
                  ("GITHUB_APP_ID", os.environ["GH_APP_ID"]),
              )
          )
          commands = [
              "set -euo pipefail",
              f"install -d -m 0755 {root}",
              f"echo {os.environ['COMPOSE_B64']} | base64 -d > {root}/compose.yml",
              f"echo {os.environ['DEPLOY_B64']} | base64 -d > {root}/deploy.sh",
              f"chmod 0700 {root}/deploy.sh",
              f"{env} {root}/deploy.sh {shlex.quote(os.environ['TAG'])}",
          ]
          print(json.dumps({
              "InstanceIds": [os.environ["INSTANCE_ID"]],
              "DocumentName": "AWS-RunShellScript",
              "Comment": f"deploy {os.environ['TAG']} ({os.environ['GITHUB_SHA'][:12]})",
              "TimeoutSeconds": 900,
              "Parameters": {"commands": commands},
          }))
          PY
          command_id="$(aws ssm send-command --cli-input-json file://command.json --query Command.CommandId --output text)"
          echo "COMMAND_ID=${command_id}" >> "$GITHUB_ENV"
      # 배포 스크립트가 끝날 때까지 기다리고, 실패하면 이 job도 실패한다.
      - name: 배포 결과 기다리기
        run: |
          set -uo pipefail
          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query Status --output text 2>/dev/null || echo Pending)"
            case "${status}" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          echo "상태: ${status}"
          aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "${status}" = "Success" ]
      # 공개 주소가 방금 올린 태그를 돌려줄 때까지 기다린다(터널이 연결되어야 응답한다).
      - name: 공개 주소 확인
        run: |
          set -uo pipefail
          for _ in $(seq 1 36); do
            version="$(curl -fsS -m 10 "${API_URL}/api/version" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
            if [ "${version}" = "${TAG}" ]; then
              echo "${API_URL}/api/version = ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "${API_URL}/api/version이 ${TAG}를 돌려주지 않았다(마지막 값: ${version:-없음})" >&2
          exit 1

  web:
    name: 화면 업로드와 캐시 무효화
    needs: deploy
    # 되돌리기에서는 화면을 다시 만들지 않는다. api가 새 버전으로 올라온 뒤에만 올린다.
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WEB_BUCKET: ${{ vars.WEB_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 화면 빌드
        env:
          VITE_API_BASE_URL: ${{ env.API_URL }}
        run: npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 웹 버킷에 올리기
        run: |
          set -euo pipefail
          [[ "${WEB_BUCKET}" =~ ^[a-z0-9][a-z0-9.-]{2,62}$ ]] || { echo "variable WEB_BUCKET이 없거나 올바르지 않다" >&2; exit 1; }
          # 파일 이름에 해시가 들어가는 파일은 오래 캐시하고, index.html은 항상 새로 받게 한다.
          aws s3 sync dist "s3://${WEB_BUCKET}" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${WEB_BUCKET}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
      - name: 캐시 무효화
        run: |
          set -euo pipefail
          [[ "${DISTRIBUTION_ID}" =~ ^[A-Z0-9]+$ ]] || { echo "variable CLOUDFRONT_DISTRIBUTION_ID가 없거나 올바르지 않다" >&2; exit 1; }
          aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*" \
            --query Invalidation.Id --output text
