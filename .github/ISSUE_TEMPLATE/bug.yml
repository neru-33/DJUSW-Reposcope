name: 버그
description: 잘못 동작하는 내용을 알립니다.
title: "[버그] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options:
        - frontend
        - backend
        - webhook
        - infra
        - 기타
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. 저장소 상세 화면을 연다
        2. 활동 기록 탭을 누른다
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과 / 실제 결과
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: 예) Chrome 130, Windows 11
